<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code 101 - Content Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: 'hsl(240 3.7% 15.9%)',
                        background: '#262624',
                        foreground: 'hsl(0 0% 98%)',
                        primary: {
                            DEFAULT: '#D17D59',
                            foreground: '#262624',
                        },
                        secondary: {
                            DEFAULT: 'hsl(240 3.7% 15.9%)',
                            foreground: 'hsl(0 0% 98%)',
                        },
                        muted: {
                            DEFAULT: 'hsl(240 3.7% 15.9%)',
                            foreground: 'hsl(240 5% 64.9%)',
                        },
                        card: {
                            DEFAULT: '#2e2e2c',
                            foreground: 'hsl(0 0% 98%)',
                        },
                        accent: {
                            blue: 'hsl(217 91% 60%)',
                            green: 'hsl(142 71% 45%)',
                            yellow: 'hsl(45 93% 47%)',
                            red: 'hsl(0 84% 60%)',
                        }
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: #262624;
            color: hsl(0 0% 98%);
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }

        /* Sidebar */
        .sidebar {
            position: sticky;
            top: 80px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: hsl(240 3.7% 25%) transparent;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: hsl(240 3.7% 25%);
            border-radius: 3px;
        }

        .toc-link {
            display: block;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            color: hsl(240 5% 64.9%);
            text-decoration: none;
            border-left: 2px solid transparent;
            transition: all 0.2s;
        }

        .toc-link:hover {
            color: hsl(0 0% 98%);
            border-left-color: hsl(240 5% 34.9%);
        }

        .toc-link.active {
            color: hsl(0 0% 98%);
            border-left-color: hsl(0 0% 98%);
            background: hsl(240 3.7% 15.9%);
        }

        .toc-link.toc-h3 {
            padding-left: 1.5rem;
            font-size: 0.8125rem;
        }

        /* Markdown Content Styling */
        .markdown-content {
            font-size: 1.0625rem;
            line-height: 1.75;
        }

        .markdown-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 1rem;
            line-height: 1.2;
            color: hsl(0 0% 98%);
            letter-spacing: -0.02em;
        }

        .markdown-content h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-top: 4rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid hsl(240 3.7% 15.9%);
            color: hsl(0 0% 98%);
            letter-spacing: -0.01em;
            scroll-margin-top: 80px;
        }

        .markdown-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            color: hsl(0 0% 95%);
            scroll-margin-top: 80px;
        }

        .markdown-content h4 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
            color: hsl(0 0% 92%);
        }

        .markdown-content p {
            margin-bottom: 1.5rem;
            color: hsl(240 5% 84%);
        }

        .markdown-content strong {
            font-weight: 600;
            color: hsl(0 0% 98%);
        }

        .markdown-content em {
            font-style: italic;
            color: hsl(240 5% 84%);
        }

        .markdown-content a {
            color: hsl(217 91% 60%);
            text-decoration: underline;
            text-underline-offset: 2px;
            text-decoration-thickness: 1px;
        }

        .markdown-content a:hover {
            color: hsl(217 91% 70%);
        }

        .markdown-content ul, .markdown-content ol {
            margin-bottom: 1.5rem;
            padding-left: 1.75rem;
            color: hsl(240 5% 84%);
        }

        .markdown-content ul {
            list-style-type: disc;
        }

        .markdown-content ol {
            list-style-type: decimal;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
            padding-left: 0.25rem;
        }

        .markdown-content li p {
            margin-bottom: 0.5rem;
        }

        .markdown-content code {
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            background: hsl(240 3.7% 15.9%);
            padding: 0.2em 0.5em;
            border-radius: 0.375rem;
            color: hsl(142 71% 65%);
            border: 1px solid hsl(240 3.7% 20%);
        }

        .markdown-content pre {
            background: hsl(240 10% 8%);
            border: 1px solid hsl(240 3.7% 15.9%);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
        }

        .markdown-content pre code {
            background: transparent;
            padding: 0;
            font-size: 0.9375rem;
            line-height: 1.6;
            color: hsl(0 0% 95%);
            border: none;
        }

        .markdown-content blockquote {
            border-left: 4px solid hsl(217 91% 60%);
            padding-left: 1.5rem;
            margin: 2rem 0;
            color: hsl(240 5% 74%);
            font-style: italic;
            background: hsl(240 10% 8%);
            padding: 1.5rem;
            padding-left: 1.5rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            font-size: 0.9375rem;
            background: hsl(240 10% 8%);
            border-radius: 0.75rem;
            overflow: hidden;
        }

        .markdown-content table th {
            background: hsl(240 10% 12%);
            border: 1px solid hsl(240 3.7% 15.9%);
            padding: 0.875rem;
            text-align: left;
            font-weight: 600;
            color: hsl(0 0% 98%);
        }

        .markdown-content table td {
            border: 1px solid hsl(240 3.7% 15.9%);
            padding: 0.875rem;
            color: hsl(240 5% 84%);
        }

        .markdown-content table tr:hover {
            background: hsl(240 10% 10%);
        }

        .markdown-content hr {
            border: none;
            border-top: 2px solid hsl(240 3.7% 15.9%);
            margin: 4rem 0;
        }

        /* Callout boxes */
        .markdown-content blockquote:has(strong:first-child) {
            position: relative;
            padding-left: 3.5rem;
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .spinner {
            border: 3px solid hsl(240 3.7% 15.9%);
            border-top: 3px solid hsl(0 0% 98%);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Navigation buttons */
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: hsl(240 10% 8%);
            border: 1px solid hsl(240 3.7% 15.9%);
            border-radius: 0.5rem;
            color: hsl(0 0% 98%);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: all 0.2s;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
        }

        .nav-btn:hover {
            background: hsl(240 10% 12%);
            border-color: hsl(240 3.7% 25%);
            transform: translateX(-2px);
        }

        .nav-btn-next:hover {
            transform: translateX(2px);
        }

        .badge {
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
        }

        /* Mobile responsive */
        @media (max-width: 1024px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-background text-foreground antialiased">
    <!-- Header -->
    <div class="border-b border-border sticky top-0 bg-background/95 backdrop-blur z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <a href="index.html" class="badge flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Back to Workshop
                </a>
                <div class="badge text-xs text-muted-foreground font-medium">
                    Claude Code 101
                </div>
            </div>
        </div>
    </div>

    <!-- Main Layout -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex gap-8">

            <!-- Sidebar TOC (Desktop only) -->
            <aside class="sidebar hidden lg:block w-64 flex-shrink-0">
                <div class="bg-card rounded-lg border border-border p-4">
                    <h3 class="text-sm font-semibold mb-3 text-foreground">On This Page</h3>
                    <nav id="toc" class="space-y-1">
                        <!-- TOC will be generated here -->
                    </nav>
                </div>
            </aside>

            <!-- Main Content -->
            <div class="flex-1 min-w-0">

                <!-- Loading State -->
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                </div>

                <!-- Content Container -->
                <article id="content" class="markdown-content hidden">
                    <!-- Markdown content will be rendered here -->
                </article>

                <!-- Navigation Footer -->
                <div id="nav-footer" class="hidden mt-16 pt-8 border-t border-border">
                    <div class="flex items-center justify-between gap-4">
                        <a id="prev-link" href="#" class="nav-btn">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                            </svg>
                            <span id="prev-text">Previous</span>
                        </a>
                        <a href="index.html" class="badge text-sm text-muted-foreground hover:text-foreground transition-colors">
                            Workshop Home
                        </a>
                        <a id="next-link" href="#" class="nav-btn nav-btn-next">
                            <span id="next-text">Next</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Get the file parameter from URL
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');

        // Navigation map
        const navigation = {
            'days/day-01-welcome.md': {
                prev: null,
                next: { file: 'days/day-02-cli-essentials.md', title: 'Day 2: CLI Essentials' }
            },
            'days/day-02-cli-essentials.md': {
                prev: { file: 'days/day-01-welcome.md', title: 'Day 1: Welcome' },
                next: { file: 'days/day-03-first-session.md', title: 'Day 3: First Session' }
            },
            'days/day-03-first-session.md': {
                prev: { file: 'days/day-02-cli-essentials.md', title: 'Day 2: CLI Essentials' },
                next: { file: 'days/day-04-project-organization.md', title: 'Day 4: Project Organization' }
            },
            'days/day-04-project-organization.md': {
                prev: { file: 'days/day-03-first-session.md', title: 'Day 3: First Session' },
                next: { file: 'days/day-05-ux-workflows-part-1.md', title: 'Day 5: UX/PM Workflows' }
            },
            'days/day-05-ux-workflows-part-1.md': {
                prev: { file: 'days/day-04-project-organization.md', title: 'Day 4: Project Organization' },
                next: { file: 'days/day-06-agents.md', title: 'Day 6: Agents' }
            },
            'days/day-06-agents.md': {
                prev: { file: 'days/day-05-ux-workflows-part-1.md', title: 'Day 5: UX/PM Workflows' },
                next: { file: 'days/day-07-ux-workflows-part-2.md', title: 'Day 7: UX/PM Workflows Part 2' }
            },
            'days/day-07-ux-workflows-part-2.md': {
                prev: { file: 'days/day-06-agents.md', title: 'Day 6: Agents' },
                next: { file: 'days/day-08-customization.md', title: 'Day 8: Customization' }
            },
            'days/day-08-customization.md': {
                prev: { file: 'days/day-07-ux-workflows-part-2.md', title: 'Day 7: UX/PM Workflows Part 2' },
                next: { file: 'days/day-09-troubleshooting.md', title: 'Day 9: Troubleshooting' }
            },
            'days/day-09-troubleshooting.md': {
                prev: { file: 'days/day-08-customization.md', title: 'Day 8: Customization' },
                next: { file: 'days/day-10-show-and-tell.md', title: 'Day 10: Show & Tell' }
            },
            'days/day-10-show-and-tell.md': {
                prev: { file: 'days/day-09-troubleshooting.md', title: 'Day 9: Troubleshooting' },
                next: null
            }
        };

        async function loadMarkdown() {
            if (!file) {
                document.getElementById('loading').innerHTML = '<p class="text-muted-foreground">No file specified</p>';
                return;
            }

            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error('File not found');

                const markdown = await response.text();

                // Configure marked options
                marked.setOptions({
                    breaks: true,
                    gfm: true,
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    }
                });

                // Convert markdown to HTML
                const html = marked.parse(markdown);

                // Display content
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').innerHTML = html;
                document.getElementById('content').classList.remove('hidden');

                // Generate TOC
                generateTOC();

                // Set up navigation
                setupNavigation();

                // Add scroll spy
                setupScrollSpy();

                // Scroll to top
                window.scrollTo(0, 0);

            } catch (error) {
                document.getElementById('loading').innerHTML =
                    `<div class="text-center">
                        <p class="text-red-400 mb-2">Error loading content</p>
                        <p class="text-sm text-muted-foreground">${error.message}</p>
                        <a href="index.html" class="inline-block mt-4 text-sm underline">Return to workshop home</a>
                    </div>`;
            }
        }

        function generateTOC() {
            const content = document.getElementById('content');
            const headings = content.querySelectorAll('h2, h3');
            const toc = document.getElementById('toc');

            if (headings.length === 0) {
                toc.innerHTML = '<p class="text-xs text-muted-foreground">No headings found</p>';
                return;
            }

            let tocHTML = '';
            headings.forEach((heading, index) => {
                const id = `heading-${index}`;
                heading.id = id;

                const level = heading.tagName.toLowerCase();
                const text = heading.textContent;
                const className = level === 'h3' ? 'toc-link toc-h3' : 'toc-link';

                tocHTML += `<a href="#${id}" class="${className}" data-target="${id}">${text}</a>`;
            });

            toc.innerHTML = tocHTML;
        }

        function setupScrollSpy() {
            const tocLinks = document.querySelectorAll('.toc-link');
            const headings = document.querySelectorAll('[id^="heading-"]');

            if (headings.length === 0) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        tocLinks.forEach(link => link.classList.remove('active'));
                        const activeLink = document.querySelector(`.toc-link[data-target="${entry.target.id}"]`);
                        if (activeLink) activeLink.classList.add('active');
                    }
                });
            }, {
                rootMargin: '-100px 0px -66%',
                threshold: 0
            });

            headings.forEach(heading => observer.observe(heading));
        }

        function setupNavigation() {
            const nav = navigation[file];
            if (!nav) return;

            const footer = document.getElementById('nav-footer');
            const prevLink = document.getElementById('prev-link');
            const nextLink = document.getElementById('next-link');
            const prevText = document.getElementById('prev-text');
            const nextText = document.getElementById('next-text');

            footer.classList.remove('hidden');

            if (nav.prev) {
                prevLink.href = `viewer.html?file=${nav.prev.file}`;
                prevText.textContent = nav.prev.title;
                prevLink.classList.remove('invisible');
            } else {
                prevLink.classList.add('invisible');
            }

            if (nav.next) {
                nextLink.href = `viewer.html?file=${nav.next.file}`;
                nextText.textContent = nav.next.title;
                nextLink.classList.remove('invisible');
            } else {
                nextLink.classList.add('invisible');
            }
        }

        // Load the markdown when page loads
        loadMarkdown();
    </script>

</body>
</html>
